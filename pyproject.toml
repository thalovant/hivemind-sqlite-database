[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-sqlite-database"
dynamic = ["version"]
description = "sqlite database plugin for hivemind-core"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
dependencies = [
    # Patched classic FileLock compatible with combo-lock's filelock~=3.0.
    "filelock==3.20.3",
    # The supported bus client still imports BitStream, removed in bitstring 5.
    "bitstring>=4.1.1,<5",
    # This legacy schema uses Client.crypto_key, removed in manager 0.9.
    "hivemind-plugin-manager>=0.6.0a1,<0.9",
    "hivemind-bus-client",
    "ovos-utils",
]


[project.optional-dependencies]
cipher = ["sqlcipher3"]
test = [
    "pytest",
    # Match the existing policy-E2E stack and its legacy connection constructor.
    "hivescope==0.4.0a2",
    "hivemind-core==4.3.0a2",
    "hivemind-ovos-agent-plugin==0.2.0a1",
    "hivemind-plugin-manager==0.6.0a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-sqlite-database"

[project.entry-points."hivemind.database"]
"hivemind-sqlite-db-plugin" = "hivemind_sqlite_database:SQLiteDB"

[tool.setuptools.dynamic]
version = {attr = "hivemind_sqlite_database.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_sqlite_database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
