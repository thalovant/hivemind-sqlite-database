permissions:
  contents: write
  pull-requests: write

name: Stable Release
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish_stable:
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-stable.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      branch: 'master'
      version_file: 'hivemind_sqlite_database/version.py'
      publish_release: true
      publish_pypi: true
      sync_dev: true
